spring.application.name=smart-employee-management
server.port=8080

# H2 for easy local run (no MySQL required)
spring.datasource.url=jdbc:h2:mem:smartemp;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL (uncomment these and comment H2 block above to use MySQL)
# spring.datasource.url=jdbc:mysql://localhost:3306/smart_emp_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# JWT (must match JwtTokenProvider @Value keys)
app.jwt.secret=SmartEmpManagementSecretKey2026ForJwtAuthenticationMustBeLongEnough256Bits
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=http://localhost:3000

# Logging
logging.level.com.smartemp=INFO
logging.level.org.springframework.security=WARN

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
